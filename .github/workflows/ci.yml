name: CI / PR Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build (Nx Affected)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Nx Base and Head SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Run Linters on Affected Projects
        run: npx nx affected -t lint --parallel=3

      - name: Run Unit Tests on Affected Projects
        run: npx nx affected -t test --parallel=3 --ci --codeCoverage

      - name: Build Affected Projects
        run: npx nx affected -t build --parallel=3
